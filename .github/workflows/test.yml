name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: bash -n bin/ccx scripts/setup.sh scripts/install.sh scripts/doctor.sh tests/stub-claude.sh tests/test-ccx.sh tests/test-setup.sh
      - name: Test launcher behavior
        run: bash tests/test-ccx.sh
      - name: Test setup wizard
        run: bash tests/test-setup.sh
